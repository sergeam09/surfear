<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Creador AR</title>
  <script src="qrcode.min.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0f0f0f;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      padding: 32px 16px;
    }

    .container {
      max-width: 540px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    h1 {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      opacity: 0.5;
      text-transform: uppercase;
    }

    .card {
      background: #1a1a1a;
      border-radius: 14px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card h2 {
      font-size: 0.75rem;
      opacity: 0.4;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    label {
      font-size: 0.82rem;
      opacity: 0.6;
      display: block;
      margin-bottom: 6px;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      background: #0f0f0f;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      padding: 10px 14px;
      color: white;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus,
    input[type="password"]:focus { border-color: rgba(255,255,255,0.3); }

    /* Tipo selector */
    .tipo-selector {
      display: flex;
      gap: 10px;
    }
    .tipo-btn {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.12);
      background: transparent;
      color: rgba(255,255,255,0.4);
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }
    .tipo-btn.active {
      background: white !important;
      color: #111 !important;
      border-color: white !important;
      font-weight: 600;
    }

    /* File drops */
    .file-drop {
      border: 1px dashed rgba(255,255,255,0.15);
      border-radius: 10px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      user-select: none;
    }
    .file-drop:hover { border-color: rgba(255,255,255,0.35); background: rgba(255,255,255,0.02); }
    .file-drop.dragover { border-color: white; background: rgba(255,255,255,0.06); }
    .file-drop .label { font-size: 0.82rem; opacity: 0.5; pointer-events: none; }
    .file-drop .filename { font-size: 0.82rem; color: #4ade80; margin-top: 4px; font-weight: 500; pointer-events: none; }
    .file-drop .btn-select {
      display: inline-block;
      margin-top: 8px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      color: white;
      border-radius: 6px;
      padding: 5px 14px;
      font-size: 0.78rem;
      cursor: pointer;
    }
    .file-drop .btn-select:hover { background: rgba(255,255,255,0.18); }

    .row { display: flex; gap: 12px; }
    .row > div { flex: 1; }

    /* Sección geospatial */
    .geo-section { display: none; flex-direction: column; gap: 14px; }
    .geo-section.show { display: flex; }

    #map {
      width: 100%;
      height: 260px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.1);
      overflow: hidden;
    }

    .map-hint {
      font-size: 0.75rem;
      opacity: 0.35;
      text-align: center;
      margin-top: -8px;
    }

    .coords-display {
      background: #0f0f0f;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.78rem;
      opacity: 0.5;
      font-family: monospace;
      letter-spacing: 0.03em;
    }

    .btn-location {
      background: none;
      border: 1px solid rgba(255,255,255,0.2);
      color: white;
      border-radius: 8px;
      padding: 9px 14px;
      font-size: 0.82rem;
      cursor: pointer;
      transition: background 0.2s;
      width: 100%;
    }
    .btn-location:hover { background: rgba(255,255,255,0.07); }

    .slider-wrap { display: flex; flex-direction: column; gap: 8px; }
    .slider-row { display: flex; align-items: center; gap: 12px; }
    input[type="range"] {
      flex: 1;
      accent-color: white;
      cursor: pointer;
    }
    .slider-val {
      font-size: 0.82rem;
      font-family: monospace;
      opacity: 0.7;
      min-width: 48px;
      text-align: right;
    }

    /* Botones principales */
    .btn-primary {
      background: white;
      color: #111;
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      transition: opacity 0.2s;
    }
    .btn-primary:hover { opacity: 0.85; }
    .btn-primary:disabled { opacity: 0.3; cursor: not-allowed; }

    /* Progress */
    .progress { display: none; flex-direction: column; gap: 8px; }
    .progress.show { display: flex; }
    .progress-bar-wrap { background: #0f0f0f; border-radius: 100px; height: 4px; overflow: hidden; }
    .progress-bar { height: 100%; background: white; border-radius: 100px; width: 0%; transition: width 0.4s ease; }
    .progress-label { font-size: 0.78rem; opacity: 0.45; }

    /* Resultado */
    .result { display: none; flex-direction: column; align-items: center; gap: 16px; padding-top: 4px; }
    .result.show { display: flex; }
    .result h2 { font-size: 0.85rem; opacity: 0.5; text-transform: uppercase; letter-spacing: 0.08em; }
    #qr-result { background: white; padding: 12px; border-radius: 12px; }

    .url-box {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #0f0f0f;
      border-radius: 10px;
      padding: 10px 14px;
      width: 100%;
    }
    .url-box span { font-size: 0.78rem; opacity: 0.55; word-break: break-all; flex: 1; }
    .btn-small {
      background: none;
      border: 1px solid rgba(255,255,255,0.2);
      color: white;
      border-radius: 7px;
      padding: 5px 12px;
      font-size: 0.75rem;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-small:hover { background: rgba(255,255,255,0.08); }

    .copy-ok { font-size: 0.75rem; color: #4ade80; opacity: 0; transition: opacity 0.3s; height: 14px; }
    .copy-ok.show { opacity: 1; }

    .btn-download {
      background: white; color: #111; border: none;
      border-radius: 10px; padding: 10px 24px;
      font-size: 0.85rem; font-weight: 700; cursor: pointer;
    }
    .btn-download:hover { opacity: 0.85; }

    .btn-nuevo {
      font-size: 0.8rem; opacity: 0.35; background: none;
      border: none; color: white; cursor: pointer; text-decoration: underline;
    }
    .btn-nuevo:hover { opacity: 0.6; }

    /* Token */
    .token-row { display: flex; gap: 8px; align-items: flex-end; }
    .token-row > div:first-child { flex: 1; }
    .btn-save-token {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.15);
      color: white; border-radius: 8px;
      padding: 10px 16px; font-size: 0.82rem;
      cursor: pointer; white-space: nowrap;
    }
    .btn-save-token:hover { background: rgba(255,255,255,0.18); }
    .token-saved { font-size: 0.72rem; color: #4ade80; opacity: 0; transition: opacity 0.3s; height: 12px; margin-top: 4px; }
    .token-saved.show { opacity: 1; }

    .error-msg {
      font-size: 0.8rem; color: #f87171; display: none;
      padding: 10px 14px; background: rgba(248,113,113,0.08); border-radius: 8px;
    }
    .error-msg.show { display: block; }

    /* World tracking file section */
    .world-section { display: none; flex-direction: column; gap: 14px; }
    .world-section.show { display: flex; }

    /* Puntos geo */
    .punto-card {
      background: #0f0f0f;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .punto-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.8rem;
      font-weight: 600;
      opacity: 0.7;
    }
    .btn-delete {
      background: none;
      border: none;
      color: #f87171;
      font-size: 0.78rem;
      cursor: pointer;
      opacity: 0.6;
    }
    .btn-delete:hover { opacity: 1; }
    select {
      width: 100%;
      background: #1a1a1a;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      padding: 8px 12px;
      color: white;
      font-size: 0.85rem;
      outline: none;
    }
    .modelo-row {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #0f0f0f;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.8rem;
    }
    .modelo-name { flex: 1; opacity: 0.6; }
    .modelo-ok { color: #4ade80; font-size: 0.75rem; }
  </style>
</head>
<body>
<div class="container">
  <h1>Creador AR</h1>

  <!-- Token -->
  <div class="card">
    <h2>GitHub Token</h2>
    <div>
      <label>Personal Access Token</label>
      <div class="token-row">
        <div><input type="password" id="gh-token" placeholder="ghp_xxxxxxxxxxxx"></div>
        <button class="btn-save-token" onclick="saveToken()">Guardar</button>
      </div>
      <div class="token-saved" id="token-saved">Token guardado en este navegador</div>
    </div>
  </div>

  <!-- Nuevo proyecto -->
  <div class="card">
    <h2>Nuevo Proyecto</h2>

    <div>
      <label>Nombre del proyecto</label>
      <input type="text" id="project-name" placeholder="ej: escultura-01, sala-norte">
    </div>

    <div>
      <label>Tipo de experiencia</label>
      <div class="tipo-selector">
        <button class="tipo-btn active" id="btn-world" onclick="setTipo('world')">World Tracking</button>
        <button class="tipo-btn" id="btn-geo" onclick="setTipo('geo')">Geospatial</button>
      </div>
    </div>

    <!-- World Tracking -->
    <div class="world-section show" id="world-section">
      <div>
        <label>Archivo GLB</label>
        <div class="file-drop" id="drop-world" onclick="triggerFile('file-glb-input')">
          <div class="label">Arrastra el archivo aqui</div>
          <div class="filename" id="name-glb"></div>
          <span class="btn-select" onclick="event.stopPropagation(); triggerFile('file-glb-input')">Seleccionar archivo</span>
          <input type="file" id="file-glb-input" accept=".glb" style="display:none" onchange="onFileInputChange('glb', this)">
        </div>
      </div>
    </div>

    <!-- Geospatial -->
    <div class="geo-section" id="geo-section">

      <!-- Pool de modelos -->
      <div>
        <label>Modelos GLB disponibles</label>
        <div id="modelos-pool" style="display:flex;flex-direction:column;gap:8px;"></div>
        <div class="file-drop" id="drop-geo-modelo" onclick="triggerFile('file-geo-input')">
        <div class="label">Arrastra el GLB aqui</div>
        <div class="filename" id="name-geo-modelo"></div>
        <span class="btn-select" onclick="event.stopPropagation(); triggerFile('file-geo-input')">Seleccionar archivo</span>
        <input type="file" id="file-geo-input" accept=".glb" style="display:none" onchange="agregarModeloDesdeInput(this)">
      </div>
      </div>

      <!-- Mapa -->
      <button class="btn-location" onclick="usarMiUbicacion()">Centrar en mi ubicacion</button>
      <div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
          <label style="margin:0;">Mapa — toca para agregar un punto</label>
          <button class="btn-small" id="btn-toggle-mapa" onclick="toggleMapa()" style="font-size:0.72rem;padding:4px 10px;">Satelite</button>
        </div>
        <div id="map"></div>
        <div class="map-hint">Cada click agrega un nuevo punto de colocacion</div>
      </div>

      <!-- Lista de puntos -->
      <div id="puntos-wrap" style="display:none;flex-direction:column;gap:10px;">
        <label>Puntos colocados</label>
        <div id="puntos-list" style="display:flex;flex-direction:column;gap:8px;"></div>
      </div>

    </div>

    <div class="error-msg" id="error-msg"></div>

    <div class="progress" id="progress">
      <div class="progress-label" id="progress-label">Subiendo archivos...</div>
      <div class="progress-bar-wrap">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
    </div>

    <button class="btn-primary" id="btn-publish" onclick="publicar()">Publicar proyecto</button>
  </div>

  <!-- Resultado -->
  <div class="card result" id="result">
    <h2>Proyecto publicado</h2>
    <div id="qr-result"></div>
    <div class="url-box">
      <span id="result-url"></span>
      <button class="btn-small" onclick="copyResult()">Copiar</button>
    </div>
    <div class="copy-ok" id="copy-ok">Copiado</div>
    <button class="btn-download" onclick="downloadQR()">Descargar QR</button>
    <button class="btn-nuevo" onclick="resetForm()">Publicar otro proyecto</button>
  </div>

</div>

<script>
  const GITHUB_USER = "sergeam09";
  const GITHUB_REPO = "surfear";
  const GITHUB_BRANCH = "main";

  let tipoActual = 'world';
  let worldFile = null;
  let map = null;
  let geoModelos = [];   // {file, name}
  let geoPuntos = [];    // {lat, lng, height, modeloIdx, marker, id}
  let puntoIdCounter = 0;

  // Token
  window.addEventListener('DOMContentLoaded', () => {
    const saved = localStorage.getItem('gh_token');
    if (saved) document.getElementById('gh-token').value = saved;
  });

  function saveToken() {
    const t = document.getElementById('gh-token').value.trim();
    if (!t) return;
    localStorage.setItem('gh_token', t);
    const el = document.getElementById('token-saved');
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2500);
  }

  // Tipo selector
  function setTipo(tipo) {
    tipoActual = tipo;
    document.getElementById('btn-world').classList.toggle('active', tipo === 'world');
    document.getElementById('btn-geo').classList.toggle('active', tipo === 'geo');
    document.getElementById('world-section').classList.toggle('show', tipo === 'world');
    document.getElementById('geo-section').classList.toggle('show', tipo === 'geo');

    if (tipo === 'geo' && !map) {
      setTimeout(initMap, 100);
    }
  }

  // ── Drag & Drop global ────────────────────────────────────
  function triggerFile(id) {
    document.getElementById(id).click();
  }

  function setupDrop(dropId, onFile) {
    const el = document.getElementById(dropId);
    if (!el) return;
    el.addEventListener('dragover', e => { e.preventDefault(); el.classList.add('dragover'); });
    el.addEventListener('dragleave', () => el.classList.remove('dragover'));
    el.addEventListener('drop', e => {
      e.preventDefault();
      el.classList.remove('dragover');
      const file = e.dataTransfer.files[0];
      if (file) onFile(file);
    });
  }

  window.addEventListener('DOMContentLoaded', () => {
    const saved = localStorage.getItem('gh_token');
    if (saved) document.getElementById('gh-token').value = saved;

    // Drop zone world tracking
    setupDrop('drop-world', file => {
      worldFile = file;
      document.getElementById('name-glb').textContent = file.name;
    });

    // Drop zone geo modelo
    setupDrop('drop-geo-modelo', file => agregarModeloDesdeFile(file));
  });

  function onFileInputChange(type, input) {
    const file = input.files[0];
    if (!file) return;
    if (type === 'glb') {
      worldFile = file;
      document.getElementById('name-glb').textContent = file.name;
    }
  }

  // ── Modelos pool ──────────────────────────────────────────
  function agregarModeloDesdeInput(input) {
    const file = input.files[0];
    if (file) agregarModeloDesdeFile(file);
    input.value = '';
  }

  function agregarModeloDesdeFile(file) {
    if (!file.name.endsWith('.glb')) { showError('Solo se aceptan archivos GLB.'); return; }
    geoModelos.push({ file, name: file.name });
    document.getElementById('name-geo-modelo').textContent = `${geoModelos.length} modelo(s) agregado(s)`;
    renderModelosPool();
    renderPuntoSelects();
  }

  function renderModelosPool() {
    const pool = document.getElementById('modelos-pool');
    pool.innerHTML = '';
    geoModelos.forEach((m, i) => {
      const row = document.createElement('div');
      row.className = 'modelo-row';
      row.innerHTML = `<span class="modelo-name">${m.name}</span><span class="modelo-ok">GLB</span>`;
      pool.appendChild(row);
    });
  }

  function renderPuntoSelects() {
    geoPuntos.forEach(p => {
      const sel = document.getElementById(`sel-modelo-${p.id}`);
      if (!sel) return;
      const current = sel.value;
      sel.innerHTML = geoModelos.map((m, i) =>
        `<option value="${i}" ${i == current ? 'selected' : ''}>${m.name}</option>`
      ).join('');
    });
  }

  // ── Mapa ──────────────────────────────────────────────────
  let capaActual = null;
  let modoSatelite = false;

  const TILES = {
    mapa: {
      url: 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
      opts: { attribution: '© OpenStreetMap © CARTO', subdomains: 'abcd', maxZoom: 19 }
    },
    satelite: {
      url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
      opts: { attribution: '© Esri', maxZoom: 19 }
    }
  };

  function initMap() {
    map = L.map('map').setView([19.4326, -99.1332], 15);
    capaActual = L.tileLayer(TILES.mapa.url, TILES.mapa.opts).addTo(map);
    map.on('click', (e) => agregarPunto(e.latlng.lat, e.latlng.lng));
  }

  function toggleMapa() {
    modoSatelite = !modoSatelite;
    const modo = modoSatelite ? 'satelite' : 'mapa';
    const btn = document.getElementById('btn-toggle-mapa');
    btn.textContent = modoSatelite ? 'Mapa' : 'Satelite';
    map.removeLayer(capaActual);
    capaActual = L.tileLayer(TILES[modo].url, TILES[modo].opts).addTo(map);
  }

  function agregarPunto(lat, lng) {
    if (geoModelos.length === 0) {
      showError('Agrega al menos un modelo GLB antes de colocar puntos.');
      return;
    }
    const id = ++puntoIdCounter;
    const num = geoPuntos.length + 1;
    const markerIcon = L.divIcon({
      html: `<div style="background:white;color:#111;border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;box-shadow:0 2px 6px rgba(0,0,0,0.4)">${num}</div>`,
      className: '', iconSize: [24, 24], iconAnchor: [12, 12]
    });
    const marker = L.marker([lat, lng], { icon: markerIcon }).addTo(map);
    const punto = { id, lat, lng, height: 1.5, modeloIdx: 0, marker, num };
    geoPuntos.push(punto);
    renderPuntosList();
    document.getElementById('puntos-wrap').style.display = 'flex';
  }

  function eliminarPunto(id) {
    const idx = geoPuntos.findIndex(p => p.id === id);
    if (idx === -1) return;
    map.removeLayer(geoPuntos[idx].marker);
    geoPuntos.splice(idx, 1);
    // Renumerar marcadores
    geoPuntos.forEach((p, i) => {
      p.num = i + 1;
      const icon = L.divIcon({
        html: `<div style="background:white;color:#111;border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;box-shadow:0 2px 6px rgba(0,0,0,0.4)">${p.num}</div>`,
        className: '', iconSize: [24, 24], iconAnchor: [12, 12]
      });
      p.marker.setIcon(icon);
    });
    renderPuntosList();
    if (geoPuntos.length === 0) document.getElementById('puntos-wrap').style.display = 'none';
  }

  function renderPuntosList() {
    const list = document.getElementById('puntos-list');
    list.innerHTML = '';
    geoPuntos.forEach(p => {
      const card = document.createElement('div');
      card.className = 'punto-card';
      card.innerHTML = `
        <div class="punto-header">
          <span>Punto ${p.num}</span>
          <button class="btn-delete" onclick="eliminarPunto(${p.id})">Eliminar</button>
        </div>
        <div style="display:flex;gap:8px;margin-bottom:4px;">
          <div style="flex:1;">
            <label style="font-size:0.7rem;opacity:0.6;display:block;margin-bottom:2px;">Latitud</label>
            <input type="number" step="0.000001" value="${p.lat.toFixed(6)}"
              style="width:100%;background:#1a1a1a;border:1px solid rgba(255,255,255,0.15);border-radius:6px;padding:6px 8px;color:white;font-size:0.8rem;"
              onchange="moverPunto(${p.id}, parseFloat(this.value), geoPuntos.find(x=>x.id==${p.id}).lng)">
          </div>
          <div style="flex:1;">
            <label style="font-size:0.7rem;opacity:0.6;display:block;margin-bottom:2px;">Longitud</label>
            <input type="number" step="0.000001" value="${p.lng.toFixed(6)}"
              style="width:100%;background:#1a1a1a;border:1px solid rgba(255,255,255,0.15);border-radius:6px;padding:6px 8px;color:white;font-size:0.8rem;"
              onchange="moverPunto(${p.id}, geoPuntos.find(x=>x.id==${p.id}).lat, parseFloat(this.value))">
          </div>
        </div>
        <div>
          <label>Modelo</label>
          <select id="sel-modelo-${p.id}" onchange="geoPuntos.find(x=>x.id==${p.id}).modeloIdx=parseInt(this.value)">
            ${geoModelos.map((m, i) => `<option value="${i}">${m.name}</option>`).join('')}
          </select>
        </div>
        <div class="slider-wrap">
          <label>Altura</label>
          <div class="slider-row">
            <input type="range" min="-5" max="20" step="0.5" value="${p.height}"
              oninput="geoPuntos.find(x=>x.id==${p.id}).height=parseFloat(this.value); document.getElementById('hval-${p.id}').textContent=this.value+' m'">
            <span class="slider-val" id="hval-${p.id}">${p.height} m</span>
          </div>
        </div>`;
      list.appendChild(card);
    });
  }

  function moverPunto(id, lat, lng) {
    if (isNaN(lat) || isNaN(lng)) return;
    const p = geoPuntos.find(x => x.id === id);
    if (!p) return;
    p.lat = lat;
    p.lng = lng;
    p.marker.setLatLng([lat, lng]);
    map.panTo([lat, lng]);
  }

  function usarMiUbicacion() {
    if (!navigator.geolocation) return showError('Tu navegador no soporta geolocalización.');
    navigator.geolocation.getCurrentPosition(pos => {
      if (!map) { initMap(); setTimeout(() => map.setView([pos.coords.latitude, pos.coords.longitude], 18), 200); }
      else map.setView([pos.coords.latitude, pos.coords.longitude], 18);
    }, () => showError('No se pudo obtener la ubicación.'));
  }

  async function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(',')[1]);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  async function getFileSha(path, token) {
    const res = await fetch(
      `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${path}`,
      { headers: { 'Authorization': `Bearer ${token}` } }
    );
    if (res.status === 404) return null;
    const data = await res.json();
    return data.sha || null;
  }

  async function uploadToGitHub(path, base64Content, token) {
    const sha = await getFileSha(path, token);
    const body = { message: `Upload ${path}`, content: base64Content, branch: GITHUB_BRANCH };
    if (sha) body.sha = sha;
    const res = await fetch(
      `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${path}`,
      {
        method: 'PUT',
        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      }
    );
    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.message || 'Error subiendo archivo');
    }
  }

  function strToBase64(str) {
    return btoa(unescape(encodeURIComponent(str)));

<body>

  <div id="hud-top">
    <div class="title">${projectName}</div>

  </div>

  <div id="nav-panel">

  </div>

  <script>
    // Suavizado de rotación de cámara — reduce la vibración del giroscopio
    AFRAME.registerComponent('smooth-camera', {
      init() {
        this.smoothQ = new THREE.Quaternion();
        this.firstFrame = true;
      },
      tick() {
        const obj = this.el.object3D;
        if (this.firstFrame) {
          this.smoothQ.copy(obj.quaternion);
          this.firstFrame = false;
          return;
        }
        // Interpolación suave: 85% valor anterior + 15% nuevo valor → amortigua jitter
        this.smoothQ.slerp(obj.quaternion, 0.15);
        obj.quaternion.copy(this.smoothQ);
      }
    });
  <\/script>

  <a-scene
    vr-mode-ui="enabled: false"
    arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best;"
    renderer="logarithmicDepthBuffer: true; precision: medium;">
    <!-- minDistance: 3 → el mundo GPS solo se reposiciona si el usuario se mueve >3m, elimina micro-saltos -->
    <a-camera gps-camera="minDistance: 3;" rotation-reader smooth-camera></a-camera>
${entities}
  </a-scene>

  <script>
    const PUNTOS = ${puntosJSON};
    let userLat = null, userLng = null;
    let puntoActivo = 0;
    let distancias = PUNTOS.map(() => Infinity);
    let prevDistancias = PUNTOS.map(() => Infinity);
    let modelosFijados = new Set();
    const MAX_DIST_REF = 200; // metros — distancia de referencia para el 0% del anillo

    /* ── Utilidades geo ── */
    function distM(lat1, lon1, lat2, lon2) {
      const R = 6371000, dLat = (lat2-lat1)*Math.PI/180, dLon = (lon2-lon1)*Math.PI/180;
      const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }
    function bearing(lat1, lon1, lat2, lon2) {
      const dLon = (lon2-lon1)*Math.PI/180;
      const y = Math.sin(dLon)*Math.cos(lat2*Math.PI/180);
      const x = Math.cos(lat1*Math.PI/180)*Math.sin(lat2*Math.PI/180) - Math.sin(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.cos(dLon);
      return (Math.atan2(y, x)*180/Math.PI + 360) % 360;
    }
    function fmtDist(d) {
      return d < 1000 ? Math.round(d) + ' m' : (d/1000).toFixed(1) + ' km';
    }

    /* ── Dots de paginación ── */
    const dotsEl = document.getElementById('dots');
    PUNTOS.forEach((_, i) => {
      const d = document.createElement('div');
      d.className = 'dot' + (i === 0 ? ' active' : '');
      d.onclick = () => setPuntoActivo(i);
      dotsEl.appendChild(d);
    });
    if (PUNTOS.length <= 1) dotsEl.style.display = 'none';

    function setPuntoActivo(i) {
      puntoActivo = i;
      document.querySelectorAll('.dot').forEach((d,j) => d.classList.toggle('active', j===i));
      actualizarCard();
    }

    /* ── Actualizar anillo y tarjeta ── */
    function actualizarCard() {
      const p = PUNTOS[puntoActivo];
      const d = distancias[puntoActivo];
      const prev = prevDistancias[puntoActivo];
      const card = document.getElementById('nav-card');
      const distEl = document.getElementById('nav-dist');
      const hintEl = document.getElementById('nav-hint');
      // btnCol siempre visible — no se usa

      document.getElementById('nav-nombre').textContent =
        'Punto ' + (puntoActivo+1) + (PUNTOS.length > 1 ? '  —  ' + p.model.replace('.glb','') : '');

      if (d === Infinity) {
        distEl.textContent = '—';
        hintEl.textContent = 'Calculando...';
        card.classList.remove('cerca');
        actualizarAnillo(0, '#f87171');
        document.getElementById('ring-pct').textContent = '—';
        return;
      }

      distEl.textContent = fmtDist(d);

      // Anillo: 0% lejos → 100% encima
      const pct = Math.max(0, Math.min(1, 1 - d / MAX_DIST_REF));
      const color = d < 10 ? '#4ade80' : d < 40 ? '#facc15' : '#f87171';
      actualizarAnillo(pct, color);
      document.getElementById('ring-pct').textContent = Math.round(pct * 100) + '%';

      // Tendencia caliente/frío
      let trend = '';
      if (prev !== Infinity && Math.abs(d - prev) > 1.5) {
        trend = d < prev ? '↑ Acercándote' : '↓ Alejándote';
      }

      if (d < 15) {
        card.classList.add('cerca');
        distEl.classList.add('cerca');
        hintEl.textContent = d < 5 ? 'Estás aquí — toca "Aquí" si no lo ves' : 'Muy cerca — toca "Aquí" si no ves el modelo';
      } else {
        card.classList.remove('cerca');
        distEl.classList.remove('cerca');
        hintEl.textContent = trend || 'Camina y observa si el % sube o baja';
      }
    }

    function actualizarAnillo(pct, color) {
      const circ = 163;
      const fill = document.getElementById('ring-fill');
      fill.style.strokeDashoffset = circ - pct * circ;
      fill.style.stroke = color;
    }

    /* ── GPS ── */
    const GPS_PRECISION_OK = 25;
    let gpsListo = false;

    navigator.geolocation && navigator.geolocation.watchPosition(
      pos => {
        userLat = pos.coords.latitude;
        userLng = pos.coords.longitude;
        const acc = Math.round(pos.coords.accuracy);

        document.getElementById('gps-wait-acc').textContent = 'Precisión: ±' + acc + 'm';
        const st = document.getElementById('gps-status');
        st.textContent = '±' + acc + 'm  ·  ' + userLat.toFixed(5) + ', ' + userLng.toFixed(5);
        st.classList.add('ok');

        if (!gpsListo && acc <= GPS_PRECISION_OK) {
          gpsListo = true;
          document.getElementById('gps-wait').style.display = 'none';
        }

        // Guardar distancias previas y recalcular
        PUNTOS.forEach((p, i) => {
          prevDistancias[i] = distancias[i] === Infinity ? Infinity : distancias[i];
          distancias[i] = distM(userLat, userLng, p.lat, p.lng);
        });
        // Ir al punto más cercano automáticamente
        const minIdx = distancias.indexOf(Math.min(...distancias));
        if (minIdx !== puntoActivo) setPuntoActivo(minIdx);
        else actualizarCard();
      },
      err => {
        const msgs = {1:'Permiso GPS denegado', 2:'GPS no disponible', 3:'Tiempo de espera agotado'};
        const st = document.getElementById('gps-status');
        st.textContent = msgs[err.code] || 'Error GPS';
        st.style.color = '#f87171';
        document.getElementById('gps-wait-acc').textContent = msgs[err.code] || 'Error GPS';
      },
      { enableHighAccuracy: true, maximumAge: 0, timeout: 15000 }
    );

    /* ── Colocar modelo en el mundo a 4m frente a la cámara ── */
    function colocarFrenteAMi() {
      const scene = document.querySelector('a-scene');
      const cam = document.querySelector('a-camera');
      if (!scene || !cam) return;

      // Ocultar entidad GPS original
      const gpsEntity = document.getElementById('geo-entity-' + puntoActivo);
      if (gpsEntity) gpsEntity.setAttribute('visible', false);

      // Eliminar colocación previa del mismo punto
      const prev = document.getElementById('anclado-' + puntoActivo);
      if (prev) prev.parentNode.removeChild(prev);

      // Posición mundial de la cámara
      const camObj = cam.object3D;
      const worldPos = new THREE.Vector3();
      camObj.getWorldPosition(worldPos);

      // Dirección hacia donde apunta la cámara (ignorar inclinación vertical)
      const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camObj.quaternion);
      dir.y = 0;
      dir.normalize();

      // 4 metros al frente, al nivel del suelo
      const target = worldPos.clone().addScaledVector(dir, 4);
      target.y = worldPos.y - 1.5;

      // Crear entidad en la ESCENA (no en la cámara) → queda fija en el mundo
      const el = document.createElement('a-entity');
      el.id = 'anclado-' + puntoActivo;
      el.setAttribute('gltf-model', 'url(' + PUNTOS[puntoActivo].model + ')');
      el.setAttribute('position', target.x + ' ' + target.y + ' ' + target.z);
      el.setAttribute('scale', '1 1 1');
      el.setAttribute('animation-mixer', '');
      scene.appendChild(el);

      modelosFijados.add(puntoActivo);

      // Toast
      const toast = document.getElementById('toast');
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    setInterval(() => { if (userLat !== null) actualizarCard(); }, 2500);
  <\/script>
</body>
</html>`);
  }

  // Publicar
  async function publicar() {
    hideError();
    const token = document.getElementById('gh-token').value.trim();
    const projectName = document.getElementById('project-name').value.trim().toLowerCase().replace(/\s+/g, '-');

    if (!token) return showError('Ingresa tu GitHub Token.');
    if (!projectName) return showError('Ingresa un nombre para el proyecto.');

    const btn = document.getElementById('btn-publish');
    btn.disabled = true;
    document.getElementById('progress').classList.add('show');

    try {
      const folder = `proyectos/${projectName}`;

      if (tipoActual === 'world') {
        if (!worldFile) return showError('Selecciona el archivo GLB.');

        setProgress(15, 'Preparando archivo...');
        const glbB64 = await fileToBase64(worldFile);

        setProgress(50, 'Subiendo GLB...');
        await uploadToGitHub(`${folder}/${worldFile.name}`, glbB64, token);

        setProgress(80, 'Generando pagina AR...');
        const pageHTML = generateWorldHTML(worldFile.name, projectName);
        await uploadToGitHub(`${folder}/index.html`, pageHTML, token);

      } else {
        if (geoModelos.length === 0) return showError('Agrega al menos un modelo GLB.');
        if (geoPuntos.length === 0) return showError('Coloca al menos un punto en el mapa.');

        // Subir modelos únicos
        const modelosUnicos = [...new Set(geoPuntos.map(p => p.modeloIdx))];
        const total = modelosUnicos.length;
        for (let i = 0; i < modelosUnicos.length; i++) {
          const m = geoModelos[modelosUnicos[i]];
          setProgress(10 + (i / total) * 60, `Subiendo ${m.name}...`);
          const b64 = await fileToBase64(m.file);
          await uploadToGitHub(`${folder}/${m.name}`, b64, token);
        }

        setProgress(80, 'Generando pagina AR...');
        const pageHTML = generateGeoHTML(geoPuntos, geoModelos, projectName);
        await uploadToGitHub(`${folder}/index.html`, pageHTML, token);
      }

      setProgress(100, 'Listo');
      const arURL = `https://${GITHUB_USER}.github.io/${GITHUB_REPO}/${folder}/`;
      setTimeout(() => mostrarResultado(arURL), 500);

    } catch (err) {
      showError('Error: ' + err.message);
      btn.disabled = false;
      document.getElementById('progress').classList.remove('show');
    }
  }

  function resetForm() {
    document.getElementById('project-name').value = '';
    document.getElementById('name-glb').textContent = '';
    document.getElementById('name-geo-modelo').textContent = '';
    worldFile = null;
    document.getElementById('progress').classList.remove('show');
    document.getElementById('result').classList.remove('show');
    document.getElementById('btn-publish').disabled = false;
    setProgress(0, '');
    hideError();
    geoPuntos.forEach(p => map && map.removeLayer(p.marker));
    geoPuntos = [];
    geoModelos = [];
    puntoIdCounter = 0;
    document.getElementById('modelos-pool').innerHTML = '';
    document.getElementById('puntos-list').innerHTML = '';
    document.getElementById('puntos-wrap').style.display = 'none';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
</script>
</body>
</html>
