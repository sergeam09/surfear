<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — AR Projects</title>
  <script src="qrcode.min.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0f0f0f;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      padding: 32px 16px;
    }

    .container {
      max-width: 540px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    h1 {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      opacity: 0.5;
      text-transform: uppercase;
    }

    .card {
      background: #1a1a1a;
      border-radius: 14px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card h2 {
      font-size: 0.75rem;
      opacity: 0.4;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    label {
      font-size: 0.82rem;
      opacity: 0.6;
      display: block;
      margin-bottom: 6px;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      background: #0f0f0f;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      padding: 10px 14px;
      color: white;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus,
    input[type="password"]:focus { border-color: rgba(255,255,255,0.3); }

    /* Tipo selector */
    .tipo-selector {
      display: flex;
      gap: 10px;
    }
    .tipo-btn {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.12);
      background: transparent;
      color: rgba(255,255,255,0.4);
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }
    .tipo-btn.active {
      background: white !important;
      color: #111 !important;
      border-color: white !important;
      font-weight: 600;
    }

    /* File drops */
    .file-drop {
      border: 1px dashed rgba(255,255,255,0.15);
      border-radius: 10px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      user-select: none;
    }
    .file-drop:hover { border-color: rgba(255,255,255,0.35); background: rgba(255,255,255,0.02); }
    .file-drop.dragover { border-color: white; background: rgba(255,255,255,0.06); }
    .file-drop .label { font-size: 0.82rem; opacity: 0.5; pointer-events: none; }
    .file-drop .filename { font-size: 0.82rem; color: #4ade80; margin-top: 4px; font-weight: 500; pointer-events: none; }
    .file-drop .btn-select {
      display: inline-block;
      margin-top: 8px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      color: white;
      border-radius: 6px;
      padding: 5px 14px;
      font-size: 0.78rem;
      cursor: pointer;
    }
    .file-drop .btn-select:hover { background: rgba(255,255,255,0.18); }

    .row { display: flex; gap: 12px; }
    .row > div { flex: 1; }

    /* Sección geospatial */
    .geo-section { display: none; flex-direction: column; gap: 14px; }
    .geo-section.show { display: flex; }

    #map {
      width: 100%;
      height: 260px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.1);
      overflow: hidden;
    }

    .map-hint {
      font-size: 0.75rem;
      opacity: 0.35;
      text-align: center;
      margin-top: -8px;
    }

    .coords-display {
      background: #0f0f0f;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.78rem;
      opacity: 0.5;
      font-family: monospace;
      letter-spacing: 0.03em;
    }

    .btn-location {
      background: none;
      border: 1px solid rgba(255,255,255,0.2);
      color: white;
      border-radius: 8px;
      padding: 9px 14px;
      font-size: 0.82rem;
      cursor: pointer;
      transition: background 0.2s;
      width: 100%;
    }
    .btn-location:hover { background: rgba(255,255,255,0.07); }

    .slider-wrap { display: flex; flex-direction: column; gap: 8px; }
    .slider-row { display: flex; align-items: center; gap: 12px; }
    input[type="range"] {
      flex: 1;
      accent-color: white;
      cursor: pointer;
    }
    .slider-val {
      font-size: 0.82rem;
      font-family: monospace;
      opacity: 0.7;
      min-width: 48px;
      text-align: right;
    }

    /* Botones principales */
    .btn-primary {
      background: white;
      color: #111;
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      transition: opacity 0.2s;
    }
    .btn-primary:hover { opacity: 0.85; }
    .btn-primary:disabled { opacity: 0.3; cursor: not-allowed; }

    /* Progress */
    .progress { display: none; flex-direction: column; gap: 8px; }
    .progress.show { display: flex; }
    .progress-bar-wrap { background: #0f0f0f; border-radius: 100px; height: 4px; overflow: hidden; }
    .progress-bar { height: 100%; background: white; border-radius: 100px; width: 0%; transition: width 0.4s ease; }
    .progress-label { font-size: 0.78rem; opacity: 0.45; }

    /* Resultado */
    .result { display: none; flex-direction: column; align-items: center; gap: 16px; padding-top: 4px; }
    .result.show { display: flex; }
    .result h2 { font-size: 0.85rem; opacity: 0.5; text-transform: uppercase; letter-spacing: 0.08em; }
    #qr-result { background: white; padding: 12px; border-radius: 12px; }

    .url-box {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #0f0f0f;
      border-radius: 10px;
      padding: 10px 14px;
      width: 100%;
    }
    .url-box span { font-size: 0.78rem; opacity: 0.55; word-break: break-all; flex: 1; }
    .btn-small {
      background: none;
      border: 1px solid rgba(255,255,255,0.2);
      color: white;
      border-radius: 7px;
      padding: 5px 12px;
      font-size: 0.75rem;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-small:hover { background: rgba(255,255,255,0.08); }

    .copy-ok { font-size: 0.75rem; color: #4ade80; opacity: 0; transition: opacity 0.3s; height: 14px; }
    .copy-ok.show { opacity: 1; }

    .btn-download {
      background: white; color: #111; border: none;
      border-radius: 10px; padding: 10px 24px;
      font-size: 0.85rem; font-weight: 700; cursor: pointer;
    }
    .btn-download:hover { opacity: 0.85; }

    .btn-nuevo {
      font-size: 0.8rem; opacity: 0.35; background: none;
      border: none; color: white; cursor: pointer; text-decoration: underline;
    }
    .btn-nuevo:hover { opacity: 0.6; }

    /* Token */
    .token-row { display: flex; gap: 8px; align-items: flex-end; }
    .token-row > div:first-child { flex: 1; }
    .btn-save-token {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.15);
      color: white; border-radius: 8px;
      padding: 10px 16px; font-size: 0.82rem;
      cursor: pointer; white-space: nowrap;
    }
    .btn-save-token:hover { background: rgba(255,255,255,0.18); }
    .token-saved { font-size: 0.72rem; color: #4ade80; opacity: 0; transition: opacity 0.3s; height: 12px; margin-top: 4px; }
    .token-saved.show { opacity: 1; }

    .error-msg {
      font-size: 0.8rem; color: #f87171; display: none;
      padding: 10px 14px; background: rgba(248,113,113,0.08); border-radius: 8px;
    }
    .error-msg.show { display: block; }

    /* World tracking file section */
    .world-section { display: none; flex-direction: column; gap: 14px; }
    .world-section.show { display: flex; }

    /* Puntos geo */
    .punto-card {
      background: #0f0f0f;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .punto-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.8rem;
      font-weight: 600;
      opacity: 0.7;
    }
    .btn-delete {
      background: none;
      border: none;
      color: #f87171;
      font-size: 0.78rem;
      cursor: pointer;
      opacity: 0.6;
    }
    .btn-delete:hover { opacity: 1; }
    select {
      width: 100%;
      background: #1a1a1a;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      padding: 8px 12px;
      color: white;
      font-size: 0.85rem;
      outline: none;
    }
    .modelo-row {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #0f0f0f;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.8rem;
    }
    .modelo-name { flex: 1; opacity: 0.6; }
    .modelo-ok { color: #4ade80; font-size: 0.75rem; }
  </style>
</head>
<body>
<div class="container">
  <h1>AR Projects — Admin</h1>

  <!-- Token -->
  <div class="card">
    <h2>GitHub Token</h2>
    <div>
      <label>Personal Access Token</label>
      <div class="token-row">
        <div><input type="password" id="gh-token" placeholder="ghp_xxxxxxxxxxxx"></div>
        <button class="btn-save-token" onclick="saveToken()">Guardar</button>
      </div>
      <div class="token-saved" id="token-saved">Token guardado en este navegador</div>
    </div>
  </div>

  <!-- Nuevo proyecto -->
  <div class="card">
    <h2>Nuevo Proyecto</h2>

    <div>
      <label>Nombre del proyecto</label>
      <input type="text" id="project-name" placeholder="ej: escultura-01, sala-norte">
    </div>

    <div>
      <label>Tipo de experiencia</label>
      <div class="tipo-selector">
        <button class="tipo-btn active" id="btn-world" onclick="setTipo('world')">World Tracking</button>
        <button class="tipo-btn" id="btn-geo" onclick="setTipo('geo')">Geospatial</button>
      </div>
    </div>

    <!-- World Tracking -->
    <div class="world-section show" id="world-section">
      <div>
        <label>Archivo GLB</label>
        <div class="file-drop" id="drop-world" onclick="triggerFile('file-glb-input')">
          <div class="label">Arrastra el archivo aqui</div>
          <div class="filename" id="name-glb"></div>
          <span class="btn-select" onclick="event.stopPropagation(); triggerFile('file-glb-input')">Seleccionar archivo</span>
          <input type="file" id="file-glb-input" accept=".glb" style="display:none" onchange="onFileInputChange('glb', this)">
        </div>
      </div>
    </div>

    <!-- Geospatial -->
    <div class="geo-section" id="geo-section">

      <!-- Pool de modelos -->
      <div>
        <label>Modelos GLB disponibles</label>
        <div id="modelos-pool" style="display:flex;flex-direction:column;gap:8px;"></div>
        <div class="file-drop" id="drop-geo-modelo" onclick="triggerFile('file-geo-input')">
        <div class="label">Arrastra el GLB aqui</div>
        <div class="filename" id="name-geo-modelo"></div>
        <span class="btn-select" onclick="event.stopPropagation(); triggerFile('file-geo-input')">Seleccionar archivo</span>
        <input type="file" id="file-geo-input" accept=".glb" style="display:none" onchange="agregarModeloDesdeInput(this)">
      </div>
      </div>

      <!-- Mapa -->
      <button class="btn-location" onclick="usarMiUbicacion()">Centrar en mi ubicacion</button>
      <div>
        <label>Mapa — toca para agregar un punto</label>
        <div id="map"></div>
        <div class="map-hint">Cada click agrega un nuevo punto de colocacion</div>
      </div>

      <!-- Lista de puntos -->
      <div id="puntos-wrap" style="display:none;flex-direction:column;gap:10px;">
        <label>Puntos colocados</label>
        <div id="puntos-list" style="display:flex;flex-direction:column;gap:8px;"></div>
      </div>

    </div>

    <div class="error-msg" id="error-msg"></div>

    <div class="progress" id="progress">
      <div class="progress-label" id="progress-label">Subiendo archivos...</div>
      <div class="progress-bar-wrap">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
    </div>

    <button class="btn-primary" id="btn-publish" onclick="publicar()">Publicar proyecto</button>
  </div>

  <!-- Resultado -->
  <div class="card result" id="result">
    <h2>Proyecto publicado</h2>
    <div id="qr-result"></div>
    <div class="url-box">
      <span id="result-url"></span>
      <button class="btn-small" onclick="copyResult()">Copiar</button>
    </div>
    <div class="copy-ok" id="copy-ok">Copiado</div>
    <button class="btn-download" onclick="downloadQR()">Descargar QR</button>
    <button class="btn-nuevo" onclick="resetForm()">Publicar otro proyecto</button>
  </div>

</div>

<script>
  const GITHUB_USER = "sergeam09";
  const GITHUB_REPO = "surfear";
  const GITHUB_BRANCH = "main";

  let tipoActual = 'world';
  let worldFile = null;
  let map = null;
  let geoModelos = [];   // {file, name}
  let geoPuntos = [];    // {lat, lng, height, modeloIdx, marker, id}
  let puntoIdCounter = 0;

  // Token
  window.addEventListener('DOMContentLoaded', () => {
    const saved = localStorage.getItem('gh_token');
    if (saved) document.getElementById('gh-token').value = saved;
  });

  function saveToken() {
    const t = document.getElementById('gh-token').value.trim();
    if (!t) return;
    localStorage.setItem('gh_token', t);
    const el = document.getElementById('token-saved');
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2500);
  }

  // Tipo selector
  function setTipo(tipo) {
    tipoActual = tipo;
    document.getElementById('btn-world').classList.toggle('active', tipo === 'world');
    document.getElementById('btn-geo').classList.toggle('active', tipo === 'geo');
    document.getElementById('world-section').classList.toggle('show', tipo === 'world');
    document.getElementById('geo-section').classList.toggle('show', tipo === 'geo');

    if (tipo === 'geo' && !map) {
      setTimeout(initMap, 100);
    }
  }

  // ── Drag & Drop global ────────────────────────────────────
  function triggerFile(id) {
    document.getElementById(id).click();
  }

  function setupDrop(dropId, onFile) {
    const el = document.getElementById(dropId);
    if (!el) return;
    el.addEventListener('dragover', e => { e.preventDefault(); el.classList.add('dragover'); });
    el.addEventListener('dragleave', () => el.classList.remove('dragover'));
    el.addEventListener('drop', e => {
      e.preventDefault();
      el.classList.remove('dragover');
      const file = e.dataTransfer.files[0];
      if (file) onFile(file);
    });
  }

  window.addEventListener('DOMContentLoaded', () => {
    const saved = localStorage.getItem('gh_token');
    if (saved) document.getElementById('gh-token').value = saved;

    // Drop zone world tracking
    setupDrop('drop-world', file => {
      worldFile = file;
      document.getElementById('name-glb').textContent = file.name;
    });

    // Drop zone geo modelo
    setupDrop('drop-geo-modelo', file => agregarModeloDesdeFile(file));
  });

  function onFileInputChange(type, input) {
    const file = input.files[0];
    if (!file) return;
    if (type === 'glb') {
      worldFile = file;
      document.getElementById('name-glb').textContent = file.name;
    }
  }

  // ── Modelos pool ──────────────────────────────────────────
  function agregarModeloDesdeInput(input) {
    const file = input.files[0];
    if (file) agregarModeloDesdeFile(file);
    input.value = '';
  }

  function agregarModeloDesdeFile(file) {
    if (!file.name.endsWith('.glb')) { showError('Solo se aceptan archivos GLB.'); return; }
    geoModelos.push({ file, name: file.name });
    document.getElementById('name-geo-modelo').textContent = `${geoModelos.length} modelo(s) agregado(s)`;
    renderModelosPool();
    renderPuntoSelects();
  }

  function renderModelosPool() {
    const pool = document.getElementById('modelos-pool');
    pool.innerHTML = '';
    geoModelos.forEach((m, i) => {
      const row = document.createElement('div');
      row.className = 'modelo-row';
      row.innerHTML = `<span class="modelo-name">${m.name}</span><span class="modelo-ok">GLB</span>`;
      pool.appendChild(row);
    });
  }

  function renderPuntoSelects() {
    geoPuntos.forEach(p => {
      const sel = document.getElementById(`sel-modelo-${p.id}`);
      if (!sel) return;
      const current = sel.value;
      sel.innerHTML = geoModelos.map((m, i) =>
        `<option value="${i}" ${i == current ? 'selected' : ''}>${m.name}</option>`
      ).join('');
    });
  }

  // ── Mapa ──────────────────────────────────────────────────
  function initMap() {
    map = L.map('map').setView([19.4326, -99.1332], 15);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap', maxZoom: 19
    }).addTo(map);
    map.on('click', (e) => agregarPunto(e.latlng.lat, e.latlng.lng));
  }

  function agregarPunto(lat, lng) {
    if (geoModelos.length === 0) {
      showError('Agrega al menos un modelo GLB antes de colocar puntos.');
      return;
    }
    const id = ++puntoIdCounter;
    const num = geoPuntos.length + 1;
    const markerIcon = L.divIcon({
      html: `<div style="background:white;color:#111;border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;box-shadow:0 2px 6px rgba(0,0,0,0.4)">${num}</div>`,
      className: '', iconSize: [24, 24], iconAnchor: [12, 12]
    });
    const marker = L.marker([lat, lng], { icon: markerIcon }).addTo(map);
    const punto = { id, lat, lng, height: 1.5, modeloIdx: 0, marker, num };
    geoPuntos.push(punto);
    renderPuntosList();
    document.getElementById('puntos-wrap').style.display = 'flex';
  }

  function eliminarPunto(id) {
    const idx = geoPuntos.findIndex(p => p.id === id);
    if (idx === -1) return;
    map.removeLayer(geoPuntos[idx].marker);
    geoPuntos.splice(idx, 1);
    // Renumerar marcadores
    geoPuntos.forEach((p, i) => {
      p.num = i + 1;
      const icon = L.divIcon({
        html: `<div style="background:white;color:#111;border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;box-shadow:0 2px 6px rgba(0,0,0,0.4)">${p.num}</div>`,
        className: '', iconSize: [24, 24], iconAnchor: [12, 12]
      });
      p.marker.setIcon(icon);
    });
    renderPuntosList();
    if (geoPuntos.length === 0) document.getElementById('puntos-wrap').style.display = 'none';
  }

  function renderPuntosList() {
    const list = document.getElementById('puntos-list');
    list.innerHTML = '';
    geoPuntos.forEach(p => {
      const card = document.createElement('div');
      card.className = 'punto-card';
      card.innerHTML = `
        <div class="punto-header">
          <span>Punto ${p.num} — ${p.lat.toFixed(5)}, ${p.lng.toFixed(5)}</span>
          <button class="btn-delete" onclick="eliminarPunto(${p.id})">Eliminar</button>
        </div>
        <div>
          <label>Modelo</label>
          <select id="sel-modelo-${p.id}" onchange="geoPuntos.find(x=>x.id==${p.id}).modeloIdx=parseInt(this.value)">
            ${geoModelos.map((m, i) => `<option value="${i}">${m.name}</option>`).join('')}
          </select>
        </div>
        <div class="slider-wrap">
          <label>Altura</label>
          <div class="slider-row">
            <input type="range" min="-5" max="20" step="0.5" value="${p.height}"
              oninput="geoPuntos.find(x=>x.id==${p.id}).height=parseFloat(this.value); document.getElementById('hval-${p.id}').textContent=this.value+' m'">
            <span class="slider-val" id="hval-${p.id}">${p.height} m</span>
          </div>
        </div>`;
      list.appendChild(card);
    });
  }

  function usarMiUbicacion() {
    if (!navigator.geolocation) return showError('Tu navegador no soporta geolocalización.');
    navigator.geolocation.getCurrentPosition(pos => {
      if (!map) { initMap(); setTimeout(() => map.setView([pos.coords.latitude, pos.coords.longitude], 18), 200); }
      else map.setView([pos.coords.latitude, pos.coords.longitude], 18);
    }, () => showError('No se pudo obtener la ubicación.'));
  }

  // Archivos world tracking
  function onFileSelect(type, input) {
    const file = input.files[0];
    if (file) document.getElementById(`name-${type}`).textContent = file.name;
  }

  // GitHub helpers
  function setProgress(pct, label) {
    document.getElementById('progress-bar').style.width = pct + '%';
    document.getElementById('progress-label').textContent = label;
  }

  function showError(msg) {
    const el = document.getElementById('error-msg');
    el.textContent = msg;
    el.classList.add('show');
  }

  function hideError() {
    document.getElementById('error-msg').classList.remove('show');
  }

  async function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(',')[1]);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  async function getFileSha(path, token) {
    const res = await fetch(
      `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${path}`,
      { headers: { 'Authorization': `Bearer ${token}` } }
    );
    if (res.status === 404) return null;
    const data = await res.json();
    return data.sha || null;
  }

  async function uploadToGitHub(path, base64Content, token) {
    const sha = await getFileSha(path, token);
    const body = { message: `Upload ${path}`, content: base64Content, branch: GITHUB_BRANCH };
    if (sha) body.sha = sha;
    const res = await fetch(
      `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${path}`,
      {
        method: 'PUT',
        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      }
    );
    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.message || 'Error subiendo archivo');
    }
  }

  function strToBase64(str) {
    return btoa(unescape(encodeURIComponent(str)));
  }

  // Generadores de páginas
  function generateWorldHTML(glbName, projectName) {
    return strToBase64(`<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>${projectName}</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"><\/script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #111; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; font-family: sans-serif; color: white; }
    h1 { font-size: 1rem; margin-bottom: 16px; opacity: 0.6; letter-spacing: 0.05em; }
    model-viewer { width: 90vw; max-width: 480px; height: 70vh; background: #1a1a1a; border-radius: 16px; }
    p { margin-top: 14px; font-size: 0.8rem; opacity: 0.4; }
  </style>
</head>
<body>
  <h1>${projectName}</h1>
  <model-viewer
    src="${glbName}"
    ar
    ar-modes="scene-viewer webxr"
    xr-environment

  <p>Toca el icono AR para verlo en tu espacio</p>

  }

  function generateGeoHTML(puntos, modelos, projectName) {
    const puntosJSON = JSON.stringify(puntos.map(p => ({
      lat: p.lat, lng: p.lng, height: p.height, model: modelos[p.modeloIdx].name
    })));

    const entities = puntos.map((p, i) => {
      const modelName = modelos[p.modeloIdx].name;
      return `
    <a-entity
      gps-entity-place="latitude: ${p.lat}; longitude: ${p.lng};"
      gltf-model="url(${modelName})"
      position="0 ${p.height} 0"
      scale="1 1 1"
      animation-mixer>
    </a-entity>`;
    }).join('\n');

    return strToBase64(`<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>${projectName}</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"><\/script>
  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"><\/script>
  <script src="https://unpkg.com/@ar-js-org/ar.js/aframe/build/aframe-ar.js"><\/script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: black; font-family: sans-serif; }

    /* HUD superior */
    #hud-top {
      position: fixed; top: 0; left: 0; right: 0;
      padding: 12px 16px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent);
      color: white; z-index: 999; pointer-events: none;
    }
    #hud-top .title { font-size: 1rem; font-weight: 600; }
    #hud-top .gps-status { font-size: 0.72rem; opacity: 0.6; margin-top: 2px; color: #facc15; }
    #hud-top .gps-status.ok { color: #4ade80; }

    /* Panel de puntos inferior */
    #puntos-panel {
      position: fixed; bottom: 0; left: 0; right: 0;
      padding: 12px 16px 24px;
      background: linear-gradient(to top, rgba(0,0,0,0.85), transparent);
      z-index: 999; pointer-events: none;
      display: flex; flex-direction: column; gap: 8px;
    }

    /* Tarjeta de cada punto */
    .punto-indicator {
      display: flex; align-items: center; gap: 12px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px; padding: 10px 14px;
      color: white; transition: border-color 0.3s;
    }
    .punto-indicator.cerca { border-color: #4ade80; background: rgba(74,222,128,0.1); }

    /* Flecha direccional */
    .flecha-wrap {
      width: 40px; height: 40px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .flecha {
      width: 0; height: 0;
      border-left: 10px solid transparent;
      border-right: 10px solid transparent;
      border-bottom: 22px solid white;
      transition: transform 0.3s ease;
    }
    .punto-indicator.cerca .flecha { border-bottom-color: #4ade80; }

    .punto-info { flex: 1; }
    .punto-nombre { font-size: 0.82rem; font-weight: 600; }
    .punto-dist {
      font-size: 1.1rem; font-weight: 700; margin-top: 1px;
      font-variant-numeric: tabular-nums;
    }
    .punto-dist.cerca { color: #4ade80; }
    .punto-hint { font-size: 0.7rem; opacity: 0.5; margin-top: 1px; }

    /* Indicador central cuando estás muy cerca */
    #cerca-alert {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: rgba(74,222,128,0.9); color: #111;
      padding: 12px 24px; border-radius: 20px;
      font-weight: 700; font-size: 1rem;
      z-index: 1000; display: none;
      animation: pulse 1s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.6} }
  </style>
</head>
<body>

  <div id="hud-top">
    <div class="title">${projectName}</div>
    <div class="gps-status" id="gps-status">Buscando señal GPS...</div>
  </div>

  <div id="puntos-panel"></div>
  <div id="cerca-alert">Mira a tu alrededor</div>

  <div id="gps-wait" style="position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:2000;display:flex;flex-direction:column;align-items:center;justify-content:center;color:white;font-family:sans-serif;gap:16px;">
    <div style="font-size:1rem;font-weight:600;">Calibrando GPS</div>
    <div id="gps-wait-msg" style="font-size:0.82rem;opacity:0.6;text-align:center;padding:0 32px;">Esperando señal estable...<br>Sal a un espacio abierto si estás en interiores.</div>
    <div id="gps-wait-acc" style="font-size:0.78rem;color:#facc15;">Precisión: —</div>
  </div>

  <a-scene
    vr-mode-ui="enabled: false"
    arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best;"
    renderer="logarithmicDepthBuffer: true; precision: medium;">
    <a-camera gps-camera rotation-reader></a-camera>
${entities}
  </a-scene>

  <script>
    const PUNTOS = ${puntosJSON};
    let userLat = null, userLng = null, userHeading = 0;

    function distM(lat1, lon1, lat2, lon2) {
      const R = 6371000, dLat = (lat2-lat1)*Math.PI/180, dLon = (lon2-lon1)*Math.PI/180;
      const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function bearing(lat1, lon1, lat2, lon2) {
      const dLon = (lon2-lon1)*Math.PI/180;
      const y = Math.sin(dLon)*Math.cos(lat2*Math.PI/180);
      const x = Math.cos(lat1*Math.PI/180)*Math.sin(lat2*Math.PI/180) - Math.sin(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.cos(dLon);
      return (Math.atan2(y, x)*180/Math.PI + 360) % 360;
    }

    function fmtDist(d) {
      return d < 1000 ? Math.round(d) + ' m' : (d/1000).toFixed(1) + ' km';
    }

    // Crear tarjetas
    const panel = document.getElementById('puntos-panel');
    PUNTOS.forEach((p, i) => {
      const card = document.createElement('div');
      card.className = 'punto-indicator';
      card.id = 'punto-' + i;
      card.innerHTML =
        '<div class="flecha-wrap"><div class="flecha" id="flecha-' + i + '"></div></div>' +
        '<div class="punto-info">' +
          '<div class="punto-nombre">Punto ' + (i+1) + (PUNTOS.length > 1 ? ' — ' + p.model.replace('.glb','') : '') + '</div>' +
          '<div class="punto-dist" id="dist-' + i + '">—</div>' +
          '<div class="punto-hint" id="hint-' + i + '">Calculando...</div>' +
        '</div>';
      panel.appendChild(card);
    });

    // GPS nativo con espera de señal estable
    const GPS_PRECISION_OK = 20; // metros — espera hasta tener al menos 20m de precisión
    let gpsListo = false;

    if (navigator.geolocation) {
      navigator.geolocation.watchPosition(
        pos => {
          userLat = pos.coords.latitude;
          userLng = pos.coords.longitude;
          const acc = Math.round(pos.coords.accuracy);

          const accEl = document.getElementById('gps-wait-acc');
          if (accEl) accEl.textContent = 'Precision: ' + acc + 'm';

          const el = document.getElementById('gps-status');
          el.textContent = 'GPS — ' + userLat.toFixed(5) + ', ' + userLng.toFixed(5) + ' (±' + acc + 'm)';
          el.classList.add('ok');

          // Ocultar pantalla de espera cuando la precisión es suficiente
          if (!gpsListo && acc <= GPS_PRECISION_OK) {
            gpsListo = true;
            const wait = document.getElementById('gps-wait');
            if (wait) wait.style.display = 'none';
          }

          actualizarIndicadores();
        },
        err => {
          const el = document.getElementById('gps-status');
          const msgs = { 1: 'Permiso GPS denegado', 2: 'GPS no disponible', 3: 'Tiempo de espera agotado' };
          el.textContent = msgs[err.code] || 'Error GPS';
          el.style.color = '#f87171';
          const accEl = document.getElementById('gps-wait-acc');
          if (accEl) accEl.textContent = msgs[err.code] || 'Error GPS';
        },
        { enableHighAccuracy: true, maximumAge: 0, timeout: 15000 }
      );
    } else {
      document.getElementById('gps-status').textContent = 'GPS no soportado';
    }

    // Brújula
    window.addEventListener('deviceorientationabsolute', e => {
      if (e.alpha !== null) { userHeading = e.alpha; actualizarFlechas(); }
    }, true);
    window.addEventListener('deviceorientation', e => {
      if (e.webkitCompassHeading !== undefined) { userHeading = e.webkitCompassHeading; actualizarFlechas(); }
      else if (e.alpha !== null) { userHeading = e.alpha; actualizarFlechas(); }
    }, true);

    function actualizarIndicadores() {
      if (userLat === null) return;
      let algunoCerca = false;
      PUNTOS.forEach((p, i) => {
        const d = distM(userLat, userLng, p.lat, p.lng);
        const distEl = document.getElementById('dist-' + i);
        const hintEl = document.getElementById('hint-' + i);
        const card = document.getElementById('punto-' + i);

        distEl.textContent = fmtDist(d);

        if (d < 5) {
          card.classList.add('cerca');
          distEl.classList.add('cerca');
          hintEl.textContent = 'Estas aqui — mira a tu alrededor';
          algunoCerca = true;
        } else if (d < 20) {
          card.classList.add('cerca');
          distEl.classList.add('cerca');
          hintEl.textContent = 'Muy cerca — gira lentamente';
        } else {
          card.classList.remove('cerca');
          distEl.classList.remove('cerca');
          hintEl.textContent = 'Camina en la direccion de la flecha';
        }
      });
      document.getElementById('cerca-alert').style.display = algunoCerca ? 'block' : 'none';
      actualizarFlechas();
    }

    function actualizarFlechas() {
      if (userLat === null) return;
      PUNTOS.forEach((p, i) => {
        const b = bearing(userLat, userLng, p.lat, p.lng);
        const rel = (b - userHeading + 360) % 360;
        const flecha = document.getElementById('flecha-' + i);
        if (flecha) flecha.style.transform = 'rotate(' + rel + 'deg)';
      });
    }

    setInterval(actualizarIndicadores, 2000);
  <\/script>
</body>
</html>`);
  }

  // Publicar
  async function publicar() {
    hideError();
    const token = document.getElementById('gh-token').value.trim();
    const projectName = document.getElementById('project-name').value.trim().toLowerCase().replace(/\s+/g, '-');

    if (!token) return showError('Ingresa tu GitHub Token.');
    if (!projectName) return showError('Ingresa un nombre para el proyecto.');

    const btn = document.getElementById('btn-publish');
    btn.disabled = true;
    document.getElementById('progress').classList.add('show');

    try {
      const folder = `proyectos/${projectName}`;

      if (tipoActual === 'world') {
        if (!worldFile) return showError('Selecciona el archivo GLB.');

        setProgress(15, 'Preparando archivo...');
        const glbB64 = await fileToBase64(worldFile);

        setProgress(50, 'Subiendo GLB...');
        await uploadToGitHub(`${folder}/${worldFile.name}`, glbB64, token);

        setProgress(80, 'Generando pagina AR...');
        const pageHTML = generateWorldHTML(worldFile.name, projectName);
        await uploadToGitHub(`${folder}/index.html`, pageHTML, token);

      } else {
        if (geoModelos.length === 0) return showError('Agrega al menos un modelo GLB.');
        if (geoPuntos.length === 0) return showError('Coloca al menos un punto en el mapa.');

        // Subir modelos únicos
        const modelosUnicos = [...new Set(geoPuntos.map(p => p.modeloIdx))];
        const total = modelosUnicos.length;
        for (let i = 0; i < modelosUnicos.length; i++) {
          const m = geoModelos[modelosUnicos[i]];
          setProgress(10 + (i / total) * 60, `Subiendo ${m.name}...`);
          const b64 = await fileToBase64(m.file);
          await uploadToGitHub(`${folder}/${m.name}`, b64, token);
        }

        setProgress(80, 'Generando pagina AR...');
        const pageHTML = generateGeoHTML(geoPuntos, geoModelos, projectName);
        await uploadToGitHub(`${folder}/index.html`, pageHTML, token);
      }

      setProgress(100, 'Listo');
      const arURL = `https://${GITHUB_USER}.github.io/${GITHUB_REPO}/${folder}/`;
      setTimeout(() => mostrarResultado(arURL), 500);

    } catch (err) {
      showError('Error: ' + err.message);
      btn.disabled = false;
      document.getElementById('progress').classList.remove('show');
    }
  }

  function mostrarResultado(url) {
    document.getElementById('result-url').textContent = url;
    document.getElementById('qr-result').innerHTML = '';
    new QRCode(document.getElementById('qr-result'), {
      text: url,
      width: 220,
      height: 220,
      colorDark: '#000000',
      colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.H
    });
    document.getElementById('result').classList.add('show');
    document.getElementById('result').scrollIntoView({ behavior: 'smooth' });
  }

  function copyResult() {
    const url = document.getElementById('result-url').textContent;
    navigator.clipboard.writeText(url).then(() => {
      const el = document.getElementById('copy-ok');
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 2000);
    });
  }

  function downloadQR() {
    const canvas = document.querySelector('#qr-result canvas');
    if (canvas) {
      const link = document.createElement('a');
      link.download = 'qr-ar.png';
      link.href = canvas.toDataURL();
      link.click();
    }
  }

  function resetForm() {
    document.getElementById('project-name').value = '';
    document.getElementById('name-glb').textContent = '';
    document.getElementById('name-geo-modelo').textContent = '';
    worldFile = null;
    document.getElementById('progress').classList.remove('show');
    document.getElementById('result').classList.remove('show');
    document.getElementById('btn-publish').disabled = false;
    setProgress(0, '');
    hideError();
    geoPuntos.forEach(p => map && map.removeLayer(p.marker));
    geoPuntos = [];
    geoModelos = [];
    puntoIdCounter = 0;
    document.getElementById('modelos-pool').innerHTML = '';
    document.getElementById('puntos-list').innerHTML = '';
    document.getElementById('puntos-wrap').style.display = 'none';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
</script>
