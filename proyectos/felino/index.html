<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>felino</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
  <script src="https://unpkg.com/@ar-js-org/ar.js/aframe/build/aframe-ar.js"></script>
  <style>
    * { margin: 0; padding: 0; }
    body { overflow: hidden; background: black; }
    #info {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.55); color: white; padding: 10px 20px;
      border-radius: 20px; font-family: sans-serif; font-size: 0.8rem;
      pointer-events: none; text-align: center; z-index: 999;
    }
  </style>
</head>
<body>
  <div id="info">felino — 1 punto</div>
  <a-scene
    vr-mode-ui="enabled: false"
    arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best;"
    renderer="logarithmicDepthBuffer: true; precision: medium;">

    <a-camera gps-camera rotation-reader></a-camera>

    <a-entity
      gps-entity-place="latitude: 19.51745272887429; longitude: -96.87060043215752;"
      gltf-model="url(felino.glb)"
      position="0 1.5 0"
      scale="1 1 1"
      animation-mixer>
    </a-entity>

  </a-scene>
</body>
</html>
