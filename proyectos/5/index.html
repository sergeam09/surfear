<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>5</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
  <script src="https://unpkg.com/@ar-js-org/ar.js/aframe/build/aframe-ar.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: black; font-family: -apple-system, sans-serif; }

    /* HUD superior */
    #hud-top {
      position: fixed; top: 0; left: 0; right: 0;
      padding: 10px 16px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.65), transparent);
      color: white; z-index: 999; pointer-events: none;
    }
    #hud-top .title { font-size: 0.95rem; font-weight: 600; }
    #gps-status { font-size: 0.68rem; opacity: 0.55; margin-top: 2px; color: #facc15; }
    #gps-status.ok { color: #4ade80; }

    /* Panel inferior — solo una tarjeta visible */
    #nav-panel {
      position: fixed; bottom: 0; left: 0; right: 0;
      padding: 0 14px 28px;
      background: linear-gradient(to top, rgba(0,0,0,0.9) 60%, transparent);
      z-index: 999;
    }

    /* Paginación: puntos clickeables */
    #dots {
      display: flex; justify-content: center; gap: 8px;
      padding: 10px 0 8px;
    }
    .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: rgba(255,255,255,0.3); cursor: pointer;
      transition: background 0.2s, transform 0.2s;
    }
    .dot.active { background: white; transform: scale(1.3); }

    /* Tarjeta única de navegación */
    #nav-card {
      display: flex; align-items: center; gap: 14px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 16px; padding: 12px 14px;
      color: white; transition: border-color 0.4s, background 0.4s;
    }
    #nav-card.cerca {
      border-color: #4ade80;
      background: rgba(74,222,128,0.08);
    }

    /* Brújula circular */
    #compass-wrap {
      flex-shrink: 0; width: 64px; height: 64px;
      position: relative;
    }
    #compass-svg { width: 64px; height: 64px; }

    /* Info central */
    #nav-info { flex: 1; min-width: 0; }
    #nav-nombre {
      font-size: 0.8rem; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      opacity: 0.75;
    }
    #nav-dist {
      font-size: 2rem; font-weight: 700; line-height: 1.1;
      font-variant-numeric: tabular-nums; letter-spacing: -0.02em;
    }
    #nav-dist.cerca { color: #4ade80; }
    #nav-hint { font-size: 0.72rem; opacity: 0.45; margin-top: 2px; }

    /* Botón "colocar aquí" — aparece cuando estás cerca y el modelo no se ve */
    #btn-colocar {
      display: none;
      background: white; color: #111;
      border: none; border-radius: 10px;
      padding: 10px 12px; font-size: 0.75rem; font-weight: 700;
      cursor: pointer; white-space: nowrap; flex-shrink: 0;
      line-height: 1.2;
    }
    #btn-colocar.visible { display: block; }

    /* Toast de confirmación */
    #toast {
      position: fixed; top: 60px; left: 50%; transform: translateX(-50%);
      background: rgba(74,222,128,0.92); color: #111;
      padding: 8px 20px; border-radius: 20px;
      font-size: 0.82rem; font-weight: 700;
      z-index: 1001; opacity: 0; transition: opacity 0.3s;
      pointer-events: none; white-space: nowrap;
    }
    #toast.show { opacity: 1; }

    /* Pantalla de calibración GPS */
    #gps-wait {
      position: fixed; inset: 0; background: rgba(0,0,0,0.88);
      z-index: 2000; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      color: white; gap: 14px;
    }
    #gps-wait h2 { font-size: 1rem; font-weight: 600; }
    #gps-wait p { font-size: 0.8rem; opacity: 0.55; text-align: center; padding: 0 32px; line-height: 1.5; }
    #gps-wait-acc { font-size: 0.8rem; color: #facc15; }
  </style>
</head>
<body>

  <div id="hud-top">
    <div class="title">5</div>
    <div id="gps-status">Buscando señal GPS...</div>
  </div>

  <div id="toast">Modelo colocado frente a ti</div>

  <!-- Panel de navegación inferior: 1 punto a la vez -->
  <div id="nav-panel">
    <div id="dots"></div>
    <div id="nav-card">
      <div id="compass-wrap">
        <svg id="compass-svg" viewBox="0 0 64 64" fill="none">
          <!-- Anillo exterior -->
          <circle cx="32" cy="32" r="29" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
          <!-- Marcadores cardinales -->
          <text x="32" y="9" text-anchor="middle" fill="white" font-size="8" font-weight="700" opacity="0.9">N</text>
          <text x="32" y="61" text-anchor="middle" fill="rgba(255,255,255,0.35)" font-size="7">S</text>
          <text x="59" y="35" text-anchor="middle" fill="rgba(255,255,255,0.35)" font-size="7">E</text>
          <text x="5" y="35" text-anchor="middle" fill="rgba(255,255,255,0.35)" font-size="7">O</text>
          <!-- Cruz fina -->
          <line x1="32" y1="14" x2="32" y2="50" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
          <line x1="14" y1="32" x2="50" y2="32" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
          <!-- Punto del usuario en el centro -->
          <circle cx="32" cy="32" r="3" fill="white" opacity="0.6"/>
          <!-- Punto de destino — se mueve en el anillo -->
          <circle id="compass-dot" cx="32" cy="5" r="5.5" fill="white"/>
          <!-- Línea desde centro al punto -->
          <line id="compass-line" x1="32" y1="32" x2="32" y2="7.5" stroke="white" stroke-width="1.5" opacity="0.5"/>
        </svg>
      </div>

      <div id="nav-info">
        <div id="nav-nombre">—</div>
        <div id="nav-dist">—</div>
        <div id="nav-hint">Calculando...</div>
      </div>

      <button id="btn-colocar" onclick="colocarFrenteAMi()">No lo<br>veo</button>
    </div>
  </div>

  <div id="gps-wait">
    <h2>Calibrando GPS</h2>
    <p>Esperando señal estable...<br>Sal a un espacio abierto si estás en interiores.</p>
    <div id="gps-wait-acc">Precisión: —</div>
  </div>

  <a-scene
    vr-mode-ui="enabled: false"
    arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best;"
    renderer="logarithmicDepthBuffer: true; precision: medium;">
    <a-camera gps-camera rotation-reader></a-camera>

    <a-entity
      id="geo-entity-0"
      gps-entity-place="latitude: 19.517427447985707; longitude: -96.87062859535219;"
      gltf-model="url(felino.glb)"
      position="0 0.5 0"
      scale="1 1 1"
      animation-mixer>
    </a-entity>
  </a-scene>

  <script>
    const PUNTOS = [{"lat":19.517427447985707,"lng":-96.87062859535219,"height":0.5,"model":"felino.glb"}];
    let userLat = null, userLng = null;
    let userHeading = 0;
    let headingHistory = [];
    let puntoActivo = 0;
    let distancias = PUNTOS.map(() => Infinity);
    let modelosFijados = new Set();

    /* ── Utilidades geo ── */
    function distM(lat1, lon1, lat2, lon2) {
      const R = 6371000, dLat = (lat2-lat1)*Math.PI/180, dLon = (lon2-lon1)*Math.PI/180;
      const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }
    function bearing(lat1, lon1, lat2, lon2) {
      const dLon = (lon2-lon1)*Math.PI/180;
      const y = Math.sin(dLon)*Math.cos(lat2*Math.PI/180);
      const x = Math.cos(lat1*Math.PI/180)*Math.sin(lat2*Math.PI/180) - Math.sin(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.cos(dLon);
      return (Math.atan2(y, x)*180/Math.PI + 360) % 360;
    }
    function fmtDist(d) {
      return d < 1000 ? Math.round(d) + ' m' : (d/1000).toFixed(1) + ' km';
    }

    /* ── Heading suavizado (promedio circular) ── */
    function addHeading(h) {
      headingHistory.push(h);
      if (headingHistory.length > 10) headingHistory.shift();
      const sins = headingHistory.map(a => Math.sin(a * Math.PI/180));
      const coss = headingHistory.map(a => Math.cos(a * Math.PI/180));
      const avgSin = sins.reduce((a,b)=>a+b,0)/sins.length;
      const avgCos = coss.reduce((a,b)=>a+b,0)/coss.length;
      userHeading = (Math.atan2(avgSin, avgCos) * 180/Math.PI + 360) % 360;
    }

    /* ── Dots de paginación ── */
    const dotsEl = document.getElementById('dots');
    PUNTOS.forEach((_, i) => {
      const d = document.createElement('div');
      d.className = 'dot' + (i === 0 ? ' active' : '');
      d.onclick = () => setPuntoActivo(i);
      dotsEl.appendChild(d);
    });
    if (PUNTOS.length <= 1) dotsEl.style.display = 'none';

    function setPuntoActivo(i) {
      puntoActivo = i;
      document.querySelectorAll('.dot').forEach((d,j) => d.classList.toggle('active', j===i));
      actualizarCard();
    }

    /* ── Actualizar la tarjeta única ── */
    function actualizarCard() {
      const p = PUNTOS[puntoActivo];
      const d = distancias[puntoActivo];
      const card = document.getElementById('nav-card');
      const distEl = document.getElementById('nav-dist');
      const hintEl = document.getElementById('nav-hint');
      const btnCol = document.getElementById('btn-colocar');

      document.getElementById('nav-nombre').textContent =
        'Punto ' + (puntoActivo+1) + (PUNTOS.length > 1 ? '  —  ' + p.model.replace('.glb','') : '');

      if (d === Infinity) {
        distEl.textContent = '—';
        hintEl.textContent = 'Calculando...';
        card.classList.remove('cerca');
        return;
      }

      distEl.textContent = fmtDist(d);

      if (d < 15) {
        card.classList.add('cerca');
        distEl.classList.add('cerca');
        hintEl.textContent = d < 5 ? 'Estás aquí — gira lentamente' : 'Muy cerca — gira despacio';
        // Ocultar brújula y mostrar botón "No lo veo"
        document.getElementById('compass-dot').setAttribute('opacity','0');
        document.getElementById('compass-line').setAttribute('opacity','0');
        if (!modelosFijados.has(puntoActivo)) btnCol.classList.add('visible');
      } else {
        card.classList.remove('cerca');
        distEl.classList.remove('cerca');
        hintEl.textContent = 'Camina hacia el punto en la brújula';
        document.getElementById('compass-dot').setAttribute('opacity','1');
        document.getElementById('compass-line').setAttribute('opacity','0.5');
        btnCol.classList.remove('visible');
        actualizarBrujula();
      }
    }

    /* ── Brújula: mueve el dot en el anillo ── */
    function actualizarBrujula() {
      if (userLat === null) return;
      const p = PUNTOS[puntoActivo];
      const b = bearing(userLat, userLng, p.lat, p.lng);
      const rel = (b - userHeading + 360) % 360;
      const rad = rel * Math.PI / 180;
      const r = 26.5; // radio del anillo
      const cx = 32 + r * Math.sin(rad);
      const cy = 32 - r * Math.cos(rad);
      const dot = document.getElementById('compass-dot');
      const line = document.getElementById('compass-line');
      dot.setAttribute('cx', cx.toFixed(1));
      dot.setAttribute('cy', cy.toFixed(1));
      // línea desde el centro al punto
      const lx = 32 + (r-6) * Math.sin(rad);
      const ly = 32 - (r-6) * Math.cos(rad);
      line.setAttribute('x2', lx.toFixed(1));
      line.setAttribute('y2', ly.toFixed(1));
    }

    /* ── GPS ── */
    const GPS_PRECISION_OK = 25;
    let gpsListo = false;

    navigator.geolocation && navigator.geolocation.watchPosition(
      pos => {
        userLat = pos.coords.latitude;
        userLng = pos.coords.longitude;
        const acc = Math.round(pos.coords.accuracy);

        document.getElementById('gps-wait-acc').textContent = 'Precisión: ±' + acc + 'm';
        const st = document.getElementById('gps-status');
        st.textContent = '±' + acc + 'm  ·  ' + userLat.toFixed(5) + ', ' + userLng.toFixed(5);
        st.classList.add('ok');

        if (!gpsListo && acc <= GPS_PRECISION_OK) {
          gpsListo = true;
          document.getElementById('gps-wait').style.display = 'none';
        }

        // Actualizar distancias y auto-seleccionar el más cercano
        PUNTOS.forEach((p, i) => {
          distancias[i] = distM(userLat, userLng, p.lat, p.lng);
        });
        // Ir al punto más cercano automáticamente
        const minIdx = distancias.indexOf(Math.min(...distancias));
        if (minIdx !== puntoActivo) setPuntoActivo(minIdx);
        else actualizarCard();
      },
      err => {
        const msgs = {1:'Permiso GPS denegado', 2:'GPS no disponible', 3:'Tiempo de espera agotado'};
        const st = document.getElementById('gps-status');
        st.textContent = msgs[err.code] || 'Error GPS';
        st.style.color = '#f87171';
        document.getElementById('gps-wait-acc').textContent = msgs[err.code] || 'Error GPS';
      },
      { enableHighAccuracy: true, maximumAge: 0, timeout: 15000 }
    );

    /* ── Brújula con suavizado ── */
    let lastHeadingUpdate = 0;
    function onOrientation(heading) {
      addHeading(heading);
      const now = Date.now();
      if (now - lastHeadingUpdate > 150) { // max 6 actualizaciones/seg
        lastHeadingUpdate = now;
        actualizarBrujula();
      }
    }
    window.addEventListener('deviceorientationabsolute', e => {
      if (e.alpha !== null) onOrientation(e.alpha);
    }, true);
    window.addEventListener('deviceorientation', e => {
      if (e.webkitCompassHeading !== undefined) onOrientation(e.webkitCompassHeading);
      else if (e.alpha !== null) onOrientation(e.alpha);
    }, true);

    /* ── Colocar modelo frente a la cámara (override GPS) ── */
    function colocarFrenteAMi() {
      const cam = document.querySelector('a-camera');
      const entity = document.getElementById('geo-entity-' + puntoActivo);
      if (!cam || !entity) return;

      // Obtener dirección de la cámara y posición mundial
      const camObj = cam.object3D;
      const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camObj.quaternion);
      dir.y = 0; // mantener horizontal
      dir.normalize();

      const pos = camObj.getWorldPosition(new THREE.Vector3());
      const target = pos.clone().addScaledVector(dir, 4); // 4m al frente

      // Quitar control GPS y posicionar manualmente en coordenadas de escena
      entity.removeAttribute('gps-entity-place');
      entity.object3D.position.set(target.x, pos.y - 1.2, target.z);
      entity.setAttribute('visible', true);

      modelosFijados.add(puntoActivo);
      document.getElementById('btn-colocar').classList.remove('visible');

      // Toast
      const toast = document.getElementById('toast');
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    setInterval(() => { if (userLat !== null) actualizarCard(); }, 2500);
  </script>
</body>
</html>
