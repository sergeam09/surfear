<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>prueba</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
  <style>
    * { margin: 0; padding: 0; }
    body { overflow: hidden; background: black; }
    #info {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.6); color: white; padding: 10px 20px;
      border-radius: 20px; font-family: sans-serif; font-size: 0.8rem;
      pointer-events: none; text-align: center; z-index: 999;
    }
  </style>
</head>
<body>
  <div id="info">prueba — 4 puntos en el mapa</div>
  <a-scene
    vr-mode-ui="enabled: false"
    embedded
    arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false; trackingMethod: best;"
    renderer="logarithmicDepthBuffer: true; precision: medium;">

    <a-camera
      gps-new-camera="minDistance: 1; maxDistance: 500; simulateAltitude: 0;"
      rotation-reader>
    </a-camera>

    <a-entity
      gps-new-entity-place="latitude: 19.52026646706246; longitude: -96.87086194753648;"
      gltf-model="url(felino.glb)"
      position="0 0 0"
      scale="1 1 1"
      animation-mixer="loop: repeat; crossFadeDuration: 0.4">
    </a-entity>
    <a-entity
      gps-new-entity-place="latitude: 19.520767019128108; longitude: -96.87071174383165;"
      gltf-model="url(felino.glb)"
      position="0 1 0"
      scale="1 1 1"
      animation-mixer="loop: repeat; crossFadeDuration: 0.4">
    </a-entity>
    <a-entity
      gps-new-entity-place="latitude: 19.522809659970065; longitude: -96.87080293893816;"
      gltf-model="url(felino.glb)"
      position="0 1.5 0"
      scale="1 1 1"
      animation-mixer="loop: repeat; crossFadeDuration: 0.4">
    </a-entity>
    <a-entity
      gps-new-entity-place="latitude: 19.523360764091265; longitude: -96.86964422464372;"
      gltf-model="url(felino.glb)"
      position="0 1.5 0"
      scale="1 1 1"
      animation-mixer="loop: repeat; crossFadeDuration: 0.4">
    </a-entity>

  </a-scene>
</body>
</html>
