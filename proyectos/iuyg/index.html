<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>iuyg</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
  <script src="https://unpkg.com/@ar-js-org/ar.js/aframe/build/aframe-ar.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: black; font-family: -apple-system, sans-serif; }

    /* HUD superior */
    #hud-top {
      position: fixed; top: 0; left: 0; right: 0;
      padding: 10px 16px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.65), transparent);
      color: white; z-index: 999; pointer-events: none;
    }
    #hud-top .title { font-size: 0.95rem; font-weight: 600; }
    #gps-status { font-size: 0.68rem; opacity: 0.55; margin-top: 2px; color: #facc15; }
    #gps-status.ok { color: #4ade80; }

    /* Panel inferior — solo una tarjeta visible */
    #nav-panel {
      position: fixed; bottom: 0; left: 0; right: 0;
      padding: 0 14px 28px;
      background: linear-gradient(to top, rgba(0,0,0,0.9) 60%, transparent);
      z-index: 999;
    }

    /* Paginación: puntos clickeables */
    #dots {
      display: flex; justify-content: center; gap: 8px;
      padding: 10px 0 8px;
    }
    .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: rgba(255,255,255,0.3); cursor: pointer;
      transition: background 0.2s, transform 0.2s;
    }
    .dot.active { background: white; transform: scale(1.3); }

    /* Tarjeta única de navegación */
    #nav-card {
      display: flex; align-items: center; gap: 14px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 16px; padding: 12px 14px;
      color: white; transition: border-color 0.4s, background 0.4s;
    }
    #nav-card.cerca {
      border-color: #4ade80;
      background: rgba(74,222,128,0.08);
    }

    /* Anillo de proximidad */
    #ring-wrap {
      flex-shrink: 0; width: 64px; height: 64px;
      position: relative; display: flex; align-items: center; justify-content: center;
    }
    #ring-svg { width: 64px; height: 64px; transform: rotate(-90deg); }
    #ring-bg   { fill: none; stroke: rgba(255,255,255,0.1); stroke-width: 5; }
    #ring-fill { fill: none; stroke-width: 5; stroke-linecap: round;
                 stroke-dasharray: 163; stroke-dashoffset: 163;
                 transition: stroke-dashoffset 0.8s ease, stroke 0.8s ease; }
    #ring-pct  {
      position: absolute; font-size: 0.68rem; font-weight: 700;
      color: white; opacity: 0.8; letter-spacing: -0.02em;
    }

    /* Info central */
    #nav-info { flex: 1; min-width: 0; }
    #nav-nombre {
      font-size: 0.8rem; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      opacity: 0.75;
    }
    #nav-dist {
      font-size: 2rem; font-weight: 700; line-height: 1.1;
      font-variant-numeric: tabular-nums; letter-spacing: -0.02em;
    }
    #nav-dist.cerca { color: #4ade80; }
    #nav-hint { font-size: 0.72rem; opacity: 0.45; margin-top: 2px; }

    /* Botón "colocar aquí" — siempre visible una vez el GPS está listo */
    #btn-colocar {
      background: white; color: #111;
      border: none; border-radius: 10px;
      padding: 10px 12px; font-size: 0.75rem; font-weight: 700;
      cursor: pointer; white-space: nowrap; flex-shrink: 0;
      line-height: 1.2; display: block;
    }

    /* Toast de confirmación */
    #toast {
      position: fixed; top: 60px; left: 50%; transform: translateX(-50%);
      background: rgba(74,222,128,0.92); color: #111;
      padding: 8px 20px; border-radius: 20px;
      font-size: 0.82rem; font-weight: 700;
      z-index: 1001; opacity: 0; transition: opacity 0.3s;
      pointer-events: none; white-space: nowrap;
    }
    #toast.show { opacity: 1; }

    /* Pantalla de calibración GPS */
    #gps-wait {
      position: fixed; inset: 0; background: rgba(0,0,0,0.88);
      z-index: 2000; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      color: white; gap: 14px;
    }
    #gps-wait h2 { font-size: 1rem; font-weight: 600; }
    #gps-wait p { font-size: 0.8rem; opacity: 0.55; text-align: center; padding: 0 32px; line-height: 1.5; }
    #gps-wait-acc { font-size: 0.8rem; color: #facc15; }
  </style>
</head>
<body>

  <div id="hud-top">
    <div class="title">iuyg</div>
    <div id="gps-status">Buscando señal GPS...</div>
  </div>

  <div id="toast">Modelo colocado frente a ti</div>

  <!-- Panel de navegación inferior: 1 punto a la vez -->
  <div id="nav-panel">
    <div id="dots"></div>
    <div id="nav-card">
      <div id="ring-wrap">
        <svg id="ring-svg" viewBox="0 0 64 64">
          <circle id="ring-bg"   cx="32" cy="32" r="26"/>
          <circle id="ring-fill" cx="32" cy="32" r="26" stroke="#f87171"/>
        </svg>
        <span id="ring-pct">—</span>
      </div>

      <div id="nav-info">
        <div id="nav-nombre">—</div>
        <div id="nav-dist">—</div>
        <div id="nav-hint">Calculando...</div>
      </div>

      <button id="btn-colocar" onclick="colocarFrenteAMi()">Poner<br>aquí</button>
    </div>
  </div>

  <div id="gps-wait">
    <h2>Calibrando GPS</h2>
    <p>Esperando señal estable...<br>Sal a un espacio abierto si estás en interiores.</p>
    <div id="gps-wait-acc">Precisión: —</div>
  </div>

  <script>
    // Suavizado de rotación de cámara — reduce la vibración del giroscopio
    AFRAME.registerComponent('smooth-camera', {
      init() {
        this.smoothQ = new THREE.Quaternion();
        this.firstFrame = true;
      },
      tick() {
        const obj = this.el.object3D;
        if (this.firstFrame) {
          this.smoothQ.copy(obj.quaternion);
          this.firstFrame = false;
          return;
        }
        // Interpolación suave: 85% valor anterior + 15% nuevo valor → amortigua jitter
        this.smoothQ.slerp(obj.quaternion, 0.15);
        obj.quaternion.copy(this.smoothQ);
      }
    });
  </script>

  <a-scene
    vr-mode-ui="enabled: false"
    arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best;"
    renderer="logarithmicDepthBuffer: true; precision: medium;">
    <!-- minDistance: 3 → el mundo GPS solo se reposiciona si el usuario se mueve >3m, elimina micro-saltos -->
    <a-camera gps-camera="minDistance: 3;" rotation-reader smooth-camera></a-camera>

    <a-entity
      id="geo-entity-0"
      gps-entity-place="latitude: 19.5128237322618; longitude: -96.88742995262147;"
      gltf-model="url(lpplane.glb)"
      position="0 0.5 0"
      scale="1 1 1"
      animation-mixer>
    </a-entity>
  </a-scene>

  <script>
    const PUNTOS = [{"lat":19.5128237322618,"lng":-96.88742995262147,"height":0.5,"model":"lpplane.glb"}];
    let userLat = null, userLng = null;
    let puntoActivo = 0;
    let distancias = PUNTOS.map(() => Infinity);
    let prevDistancias = PUNTOS.map(() => Infinity);
    let modelosFijados = new Set();
    const MAX_DIST_REF = 200; // metros — distancia de referencia para el 0% del anillo

    /* ── Utilidades geo ── */
    function distM(lat1, lon1, lat2, lon2) {
      const R = 6371000, dLat = (lat2-lat1)*Math.PI/180, dLon = (lon2-lon1)*Math.PI/180;
      const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }
    function bearing(lat1, lon1, lat2, lon2) {
      const dLon = (lon2-lon1)*Math.PI/180;
      const y = Math.sin(dLon)*Math.cos(lat2*Math.PI/180);
      const x = Math.cos(lat1*Math.PI/180)*Math.sin(lat2*Math.PI/180) - Math.sin(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.cos(dLon);
      return (Math.atan2(y, x)*180/Math.PI + 360) % 360;
    }
    function fmtDist(d) {
      return d < 1000 ? Math.round(d) + ' m' : (d/1000).toFixed(1) + ' km';
    }

    /* ── Dots de paginación ── */
    const dotsEl = document.getElementById('dots');
    PUNTOS.forEach((_, i) => {
      const d = document.createElement('div');
      d.className = 'dot' + (i === 0 ? ' active' : '');
      d.onclick = () => setPuntoActivo(i);
      dotsEl.appendChild(d);
    });
    if (PUNTOS.length <= 1) dotsEl.style.display = 'none';

    function setPuntoActivo(i) {
      puntoActivo = i;
      document.querySelectorAll('.dot').forEach((d,j) => d.classList.toggle('active', j===i));
      actualizarCard();
    }

    /* ── Actualizar anillo y tarjeta ── */
    function actualizarCard() {
      const p = PUNTOS[puntoActivo];
      const d = distancias[puntoActivo];
      const prev = prevDistancias[puntoActivo];
      const card = document.getElementById('nav-card');
      const distEl = document.getElementById('nav-dist');
      const hintEl = document.getElementById('nav-hint');
      // btnCol siempre visible — no se usa

      document.getElementById('nav-nombre').textContent =
        'Punto ' + (puntoActivo+1) + (PUNTOS.length > 1 ? '  —  ' + p.model.replace('.glb','') : '');

      if (d === Infinity) {
        distEl.textContent = '—';
        hintEl.textContent = 'Calculando...';
        card.classList.remove('cerca');
        actualizarAnillo(0, '#f87171');
        document.getElementById('ring-pct').textContent = '—';
        return;
      }

      distEl.textContent = fmtDist(d);

      // Anillo: 0% lejos → 100% encima
      const pct = Math.max(0, Math.min(1, 1 - d / MAX_DIST_REF));
      const color = d < 10 ? '#4ade80' : d < 40 ? '#facc15' : '#f87171';
      actualizarAnillo(pct, color);
      document.getElementById('ring-pct').textContent = Math.round(pct * 100) + '%';

      // Tendencia caliente/frío
      let trend = '';
      if (prev !== Infinity && Math.abs(d - prev) > 1.5) {
        trend = d < prev ? '↑ Acercándote' : '↓ Alejándote';
      }

      if (d < 15) {
        card.classList.add('cerca');
        distEl.classList.add('cerca');
        hintEl.textContent = d < 5 ? 'Estás aquí — toca "Aquí" si no lo ves' : 'Muy cerca — toca "Aquí" si no ves el modelo';
      } else {
        card.classList.remove('cerca');
        distEl.classList.remove('cerca');
        hintEl.textContent = trend || 'Camina y observa si el % sube o baja';
      }
    }

    function actualizarAnillo(pct, color) {
      const circ = 163;
      const fill = document.getElementById('ring-fill');
      fill.style.strokeDashoffset = circ - pct * circ;
      fill.style.stroke = color;
    }

    /* ── GPS ── */
    const GPS_PRECISION_OK = 25;
    let gpsListo = false;

    navigator.geolocation && navigator.geolocation.watchPosition(
      pos => {
        userLat = pos.coords.latitude;
        userLng = pos.coords.longitude;
        const acc = Math.round(pos.coords.accuracy);

        document.getElementById('gps-wait-acc').textContent = 'Precisión: ±' + acc + 'm';
        const st = document.getElementById('gps-status');
        st.textContent = '±' + acc + 'm  ·  ' + userLat.toFixed(5) + ', ' + userLng.toFixed(5);
        st.classList.add('ok');

        if (!gpsListo && acc <= GPS_PRECISION_OK) {
          gpsListo = true;
          document.getElementById('gps-wait').style.display = 'none';
        }

        // Guardar distancias previas y recalcular
        PUNTOS.forEach((p, i) => {
          prevDistancias[i] = distancias[i] === Infinity ? Infinity : distancias[i];
          distancias[i] = distM(userLat, userLng, p.lat, p.lng);
        });
        // Ir al punto más cercano automáticamente
        const minIdx = distancias.indexOf(Math.min(...distancias));
        if (minIdx !== puntoActivo) setPuntoActivo(minIdx);
        else actualizarCard();
      },
      err => {
        const msgs = {1:'Permiso GPS denegado', 2:'GPS no disponible', 3:'Tiempo de espera agotado'};
        const st = document.getElementById('gps-status');
        st.textContent = msgs[err.code] || 'Error GPS';
        st.style.color = '#f87171';
        document.getElementById('gps-wait-acc').textContent = msgs[err.code] || 'Error GPS';
      },
      { enableHighAccuracy: true, maximumAge: 0, timeout: 15000 }
    );

    /* ── Colocar modelo en el mundo a 4m frente a la cámara ── */
    function colocarFrenteAMi() {
      const scene = document.querySelector('a-scene');
      const cam = document.querySelector('a-camera');
      if (!scene || !cam) return;

      // Ocultar entidad GPS original
      const gpsEntity = document.getElementById('geo-entity-' + puntoActivo);
      if (gpsEntity) gpsEntity.setAttribute('visible', false);

      // Eliminar colocación previa del mismo punto
      const prev = document.getElementById('anclado-' + puntoActivo);
      if (prev) prev.parentNode.removeChild(prev);

      // Posición mundial de la cámara
      const camObj = cam.object3D;
      const worldPos = new THREE.Vector3();
      camObj.getWorldPosition(worldPos);

      // Dirección hacia donde apunta la cámara (ignorar inclinación vertical)
      const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camObj.quaternion);
      dir.y = 0;
      dir.normalize();

      // 4 metros al frente, al nivel del suelo
      const target = worldPos.clone().addScaledVector(dir, 4);
      target.y = worldPos.y - 1.5;

      // Crear entidad en la ESCENA (no en la cámara) → queda fija en el mundo
      const el = document.createElement('a-entity');
      el.id = 'anclado-' + puntoActivo;
      el.setAttribute('gltf-model', 'url(' + PUNTOS[puntoActivo].model + ')');
      el.setAttribute('position', target.x + ' ' + target.y + ' ' + target.z);
      el.setAttribute('scale', '1 1 1');
      el.setAttribute('animation-mixer', '');
      scene.appendChild(el);

      modelosFijados.add(puntoActivo);

      // Toast
      const toast = document.getElementById('toast');
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    setInterval(() => { if (userLat !== null) actualizarCard(); }, 2500);
  </script>
</body>
</html>
